<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NestCode - Agencia de Desarrollo Digital</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
    }

    /* BARRA DE NAVEGACIÓN */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #f1f5f9;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #334155;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .btn-client {
      border: 1.5px solid #4f46e5;
      color: #4f46e5;
      padding: 8px 20px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* SECCIÓN HERO (CENTRADA) */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;      /* Centra todo el bloque horizontalmente */
      justify-content: center;
      text-align: center;       /* Centra los textos */
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* COMPONENTE: LOGO + BADGE */
    .brand-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
      width: 100%;
    }

    .brand-logo {
      width: 95px;             /* Ajusta según el tamaño exacto de tu imagen */
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .brand-badge {
      background-color: #ffffff;
      color: #4f46e5;
      border: 1px solid #e2e8f0;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* ENCABEZADOS Y TEXTOS */
    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
      margin-bottom: 20px;
      max-width: 850px;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: #64748b;
      max-width: 700px;
      line-height: 1.6;
    }

    /* RESPONSIVO PARA MÓVILES */
    @media (max-width: 640px) {
      .brand-container {
        flex-direction: column; /* Apila el logo y la etiqueta en pantallas pequeñas */
        gap: 12px;
      }

      .hero-title {
        font-size: 2rem;
      }
      
      .navbar {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Navegación superior -->
  <header>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#proceso">Proceso</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
      <a href="#clientes" class="btn-client">Acceso Clientes</a>
    </nav>
  </header>

  <!-- Sección Principal / Hero -->
  <main>
    <section class="hero">
      
      <!-- Bloque del Logo y Badge alineados -->
      <div class="brand-container">
        <img src="tu-imagen-logo.png" alt="NestCode Logo" class="brand-logo">
        <span class="brand-badge">Agencia de Desarrollo Digital</span>
      </div>

      <!-- Título y descripción centrados -->
      <h1 class="hero-title">
        Construimos experiencias digitales modernas y escalables
      </h1>
      
      <p class="hero-subtitle">
        Especializados en desarrollo web full-stack, interfaces atractivas y rendimiento optimizado.
      </p>

    </section>
  </main>

</body>
</html>
