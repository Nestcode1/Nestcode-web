<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NestCode - Agencia de Desarrollo Digital</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #0f172a;
      scroll-behavior: smooth;
    }

    /* BARRA DE NAVEGACIÓN */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #f1f5f9;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: #334155;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #4f46e5;
    }

    .btn-client {
      border: 1.5px solid #4f46e5;
      color: #4f46e5;
      padding: 8px 20px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-client:hover {
      background-color: #4f46e5;
      color: #ffffff;
    }

    /* SECCIÓN HERO (TOTALMENTE CENTRADA) */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;      /* Centra todo el bloque horizontalmente */
      justify-content: center;
      text-align: center;       /* Centra los textos */
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* COMPONENTE: LOGO + BADGE */
    .brand-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
      width: 100%;
    }

    .brand-logo {
      width: 95px;             
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .brand-badge {
      background-color: #ffffff;
      color: #4f46e5;
      border: 1px solid #e2e8f0;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* ENCABEZADOS Y TEXTOS HERO */
    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
      margin-bottom: 20px;
      max-width: 850px;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: #64748b;
      max-width: 700px;
      line-height: 1.6;
    }

    /* SECCIÓN DE CONTACTO */
    .contact-section {
      max-width: 600px;
      margin: 40px auto 80px auto;
      padding: 0 20px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }

    .form-group input,
    .form-group textarea {
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #4f46e5;
    }

    .btn-submit {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #4338ca;
    }

    .form-status {
      margin-top: 12px;
      font-size: 0.95rem;
      text-align: center;
    }

    /* RESPONSIVO PARA MÓVILES */
    @media (max-width: 640px) {
      .brand-container {
        flex-direction: column;
        gap: 12px;
      }

      .hero-title {
        font-size: 2rem;
      }
      
      .navbar {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Navegación superior -->
  <header>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#proceso">Proceso</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
      <a href="#clientes" class="btn-client">Acceso Clientes</a>
    </nav>
  </header>

  <!-- Sección Principal / Hero -->
  <main id="inicio">
    <section class="hero">
      
      <!-- Bloque del Logo y Badge alineados al centro -->
      <div class="brand-container">
        <img src="tu-imagen-logo.png" alt="NestCode Logo" class="brand-logo">
        <span class="brand-badge">Agencia de Desarrollo Digital</span>
      </div>

      <!-- Título y descripción centrados -->
      <h1 class="hero-title">
        Construimos experiencias digitales modernas y escalables
      </h1>
      
      <p class="hero-subtitle">
        Especializados en desarrollo web full-stack, interfaces atractivas y rendimiento optimizado para hacer crecer tu negocio.
      </p>

    </section>

    <!-- Sección de Contacto -->
    <section id="contacto" class="contact-section">
      <form id="contact-form" action="https://formspree.io/f/TU_ID_FORMSPREE" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required placeholder="Tu nombre">
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="4" required placeholder="¿En qué podemos ayudarte?"></textarea>
        </div>

        <button type="submit" id="form-btn" class="btn-submit">Enviar Mensaje</button>
        <p id="form-status" class="form-status"></p>
      </form>
    </section>
  </main>

  <!-- LÓGICA JAVASCRIPT (Envío asíncrono) -->
  <script>
    const form = document.getElementById('contact-form');
    const formBtn = document.getElementById('form-btn');
    const formStatus = document.getElementById('form-status');

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const data = new FormData(event.target);
      formBtn.disabled = true;
      formBtn.textContent = 'Enviando...';
      formStatus.textContent = '';

      try {
        const response = await fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          formStatus.style.color = '#16a34a';
          formStatus.textContent = '¡Gracias! Tu mensaje ha sido enviado correctamente.';
          form.reset();
        } else {
          const result = await response.json();
          formStatus.style.color = '#dc2626';
          if (Object.hasOwn(result, 'errors')) {
            formStatus.textContent = result["errors"].map(error => error["message"]).join(", ");
          } else {
            formStatus.textContent = 'Ocurrió un error al enviar el formulario.';
          }
        }
      } catch (error) {
        formStatus.style.color = '#dc2626';
        formStatus.textContent = 'Error de red. Inténtalo de nuevo más tarde.';
      } finally {
        formBtn.disabled = false;
        formBtn.textContent = 'Enviar Mensaje';
      }
    });
  </script>

</body>
</html>
